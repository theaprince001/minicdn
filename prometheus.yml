global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'edge-us'
    static_configs:
      - targets: ['host.docker.internal:9003']   # US edge
  - job_name: 'edge-eu'
    static_configs:
      - targets: ['host.docker.internal:9002']   # EU edge
  - job_name: 'router'
    static_configs:
      - targets: ['host.docker.internal:8080']
  - job_name: 'shield'
    static_configs:
      - targets: ['host.docker.internal:9000']